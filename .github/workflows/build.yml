name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: CLI smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          ./build/zeralands_cli --list
          ./build/zeralands_cli --env mountains_alpine --era roman --seed 42 --res 257 --rail --race --no-brain --out smoke --previews
          ./build/zeralands_cli --import smoke/mountains_alpine_roman_257_s42_v0_height16.png --import-erosion 0.5 --env fjords --res 257 --no-brain --out smoke --name reimport
          ./build/zeralands_cli --env desert_erg --era atomic --seed dunes --res 257 --out smoke --name brain
          ./build/zeralands_cli --brain-train 3
      - name: CLI smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./build/Release/zeralands_cli.exe --list
          ./build/Release/zeralands_cli.exe --env mountains_alpine --era roman --seed 42 --res 257 --rail --race --no-brain --out smoke --previews
          ./build/Release/zeralands_cli.exe --import smoke/mountains_alpine_roman_257_s42_v0_height16.png --import-erosion 0.5 --env fjords --res 257 --no-brain --out smoke --name reimport
          ./build/Release/zeralands_cli.exe --env desert_erg --era atomic --seed dunes --res 257 --out smoke --name brain
          ./build/Release/zeralands_cli.exe --brain-train 3
      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ZeraLands-windows
          path: |
            build/Release/ZeraLands.exe
            build/Release/zeralands_cli.exe
            build/Release/assets
